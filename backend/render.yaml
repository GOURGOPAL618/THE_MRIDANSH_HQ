services:
  - type: web
    name: the-mridansh-hq-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mridansh-hq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COMMANDER_USERNAME
        value: commander
      - key: COMMANDER_PASSWORD
        generateValue: true
      - key: GLOBAL_MOCK_MODE
        value: "false"

databases:
  - name: mridansh-hq-db
    plan: free
