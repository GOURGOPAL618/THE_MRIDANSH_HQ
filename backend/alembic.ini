# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = database/migrations

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, used to find modules.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# version path separator; as of Alembic 1.3, this can be ',' or ' '
version_path_separator = os

# sqlalchemy.url is dynamically overridden in env.py from environment variables
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/mridansh_hq

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
